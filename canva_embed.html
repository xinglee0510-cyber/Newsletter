  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;

      background: #f7f7f8;
    }
    main {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }
    .canva-embed {
      position: relative;
      width: 100%;
      height: 0;
      padding-top: 100%;
      overflow: hidden;

    .canva-embed iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .credit {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }
    .credit a { color: #3858e9; }

    <div class="canva-embed">

        title="Magic Write Canva design"
        allowfullscreen

    <p class="credit">
